    <script>

        let inAllowedDomainFlag = false;
        function redirectToWordAddinPage() {
            const currentLocation = window.location;			
            if (currentLocation.ancestorOrigins && currentLocation.ancestorOrigins.length) {
                for (var i = 0; i < currentLocation.ancestorOrigins.length; i++) {
                    if (
                           (currentLocation.ancestorOrigins[i].includes("docucollab.com"))
                        || (currentLocation.ancestorOrigins[i].includes("reviewwith.me"))
                        || (currentLocation.ancestorOrigins[i].includes("appsmicro.com"))
                    )
                    {
						inAllowedDomainFlag = true;
                        var urlstring = currentLocation.ancestorOrigins[i] + "/WordAddIns.aspx";
                        window.location.replace(urlstring);
                        break;
                    }

                }
            }
            
        };

        window.addEventListener("load", function () {
            //redirectToWordAddinPage();
        });

        async function getCustomPropertiesAsObject() {
            if (!Office.context.requirements.isSetSupported("WordApi", "1.3")) {
                console.error("Word API 1.3 is not supported in this environment.");
                return {};
            }

            try {
                return await Word.run(async (context) => {
                    const properties = context.document.properties.customProperties;
                    properties.load("items");
                    await context.sync();

                    const result = {};
                    for (const prop of properties.items) {
                        result[prop.key] = prop.value;
                    }

                    return result;
                });
            } catch (error) {
                console.error("Error retrieving custom properties:", error);
                return {};
            }
        }

        Office.onReady(async function (info) {
            if (info.host === Office.HostType.Word) {
                const customProps = await getCustomPropertiesAsObject();
                if (!inAllowedDomainFlag && customProps && customProps.DocucollabDomain) {
                    //window.location.replace(customProps.DocucollabDomain + "/WordAddIns.aspx");
                    //window.location.replace(customProps.DocucollabDomain + "/authexternal.aspx?mode=azure&action=initiatelogin&redirectpagename=WordAddIns.aspx");
                    Office.context.ui.displayDialogAsync(
                        customProps.DocucollabDomain + "/authexternal.aspx?mode=azure&action=initiatelogin&redirectpagename=LoginSilentConfirmation_add-in.html",
                        { height: 50, width: 50 },
                        function (result) {
                            const dialog = result.value;

                            dialog.addEventHandler(Office.EventType.DialogMessageReceived, function (arg) {
                                const result = JSON.parse(arg.message);
                                if (result.dc_status === "success") {
                                    dialog.close();
                                    window.location.href = customProps.DocucollabDomain + "/WordAddIns.aspx";
                                }
                            });
                        }
                    );
                }
            }
        });      


    </script>
